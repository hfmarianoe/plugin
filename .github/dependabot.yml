# Mantiene al día las acciones de GitHub fijadas por hash y las dependencias de las pruebas E2E.
version: 2
updates:
  # Acciones de .github/workflows: Dependabot cambia el hash y el comentario de versión (# v7.0.1) a la vez.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Un solo PR con todas las acciones que tengan versión nueva, para no llenar el repositorio de PRs.
    groups:
      acciones:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "CI"

  # Playwright y axe-core de e2e/ (la raíz del proyecto no tiene dependencias npm).
  # Actualiza package.json y package-lock.json, que es lo que instala `npm ci` en el CI.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    # Las versiones menores y de parche van juntas en un PR; las mayores llegan por separado porque pueden romper pruebas.
    groups:
      e2e:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "e2e"
