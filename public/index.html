<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Muro de notas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fafaf7; --fg:#1d1d1b; --card:#fff; --muted:#6b6b66; --accent:#3b5bdb; --on-accent:#fff;
    --line:#e4e4de; --line-strong:#8a8a84; --error:#c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#16161a; --fg:#ececea; --card:#1f1f25; --muted:#9a9a94; --accent:#7b93ff; --on-accent:#16161a;
      --line:#2e2e36; --line-strong:#6b6b75; --error:#ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  h2 { margin:0 0 12px; font-size:1.1rem; }
  .sub { color:var(--muted); margin:0 0 24px; font-size:.9rem; }
  form { display:grid; gap:8px; margin-bottom:24px; }
  label { font-weight:600; font-size:.95rem; }
  .hint { color:var(--muted); font-size:.85rem; margin:0; }
  input, textarea, button { font:inherit; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--card); color:var(--fg); }
  input::placeholder, textarea::placeholder { color:var(--muted); opacity:1; }
  button { background:var(--accent); color:var(--on-accent); border:0; cursor:pointer; font-weight:600; }
  button[aria-disabled="true"] { opacity:.6; cursor:wait; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  ul.notes { list-style:none; margin:0; padding:0; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; overflow-wrap:anywhere; }
  .note time { color:var(--muted); font-size:.85rem; margin-left:6px; }
  .note p { margin:4px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  #err { color:var(--error); min-height:1.2em; font-size:.9rem; margin:0; }
  #status { min-height:1.2em; font-size:.9rem; margin:0; }
</style>
</head>
<body>
<main>
  <h1>Muro de notas</h1>
  <p class="sub">Sandbox para probar plugins y skills · almacenamiento: <span id="mode">cargando…</span></p>
  <form id="f">
    <label for="author">Nombre (opcional)</label>
    <input id="author" name="author" placeholder="Tu nombre" maxlength="40" autocomplete="name">
    <label for="body">Nota (obligatoria)</label>
    <textarea id="body" name="body" placeholder="Escribe una nota…" maxlength="280" rows="3" required aria-describedby="count"></textarea>
    <p class="hint" id="count">0 / 280 caracteres</p>
    <div class="hp" aria-hidden="true" inert><input name="hp_check" tabindex="-1" autocomplete="off"></div>
    <button type="submit">Publicar</button>
    <p id="status" role="status"></p>
    <p id="err" role="alert"></p>
  </form>
  <section aria-labelledby="notas-titulo">
    <h2 id="notas-titulo">Notas</h2>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => t.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sending = false;

async function load() {
  const r = await fetch('/api/notes');
  const data = await r.json();
  if (!r.ok) { $('#err').textContent = data.error; return; }
  $('#mode').textContent = data.mode === 'supabase' ? 'Supabase (Postgres)' : 'memoria (demo, se reinicia)';
  $('#list').innerHTML = data.notes.length
    ? '<ul class="notes">' + data.notes.map((n) => `<li class="note"><strong>${esc(n.author)}</strong><time datetime="${esc(n.created_at)}">${new Date(n.created_at).toLocaleString()}</time><p>${esc(n.body)}</p></li>`).join('') + '</ul>'
    : '<p class="sub">Aún no hay notas. ¡Escribe la primera!</p>';
}

$('#body').addEventListener('input', (e) => {
  $('#count').textContent = `${Array.from(e.target.value).length} / 280 caracteres`;
});

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (sending) return;
  sending = true;
  // aria-disabled (not disabled) keeps keyboard focus on the button while sending.
  const btn = e.target.querySelector('button'); btn.setAttribute('aria-disabled', 'true');
  $('#err').textContent = ''; $('#status').textContent = '';
  try {
    const r = await fetch('/api/notes', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    if (!r.ok) { $('#err').textContent = (await r.json()).error; return; }
    e.target.body.value = '';
    $('#count').textContent = '0 / 280 caracteres';
    $('#status').textContent = 'Nota publicada';
    await load();
  } finally {
    sending = false;
    btn.removeAttribute('aria-disabled');
  }
});
load();
</script>
</body>
</html>
